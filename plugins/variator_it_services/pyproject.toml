[project]
name = "variator-it-services"
version = "0.1.0"
description = "VARIATOR plugin: IT services: software outsourcing decisions"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "lizard>=1.17",
    "variator",
]

[project.entry-points."variator.plugins"]
it_services = "variator_it_services:plugin"

[tool.uv.sources]
variator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/variator_it_services"]
