[project]
name = "variator-logistics"
version = "0.1.0"
description = "VARIATOR plugin: logistics and warehousing decisions"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["variator"]

[project.entry-points."variator.plugins"]
logistics = "variator_logistics:plugin"

[tool.uv.sources]
variator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/variator_logistics"]
